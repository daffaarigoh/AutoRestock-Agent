<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - AutoRestock V2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --bg-dark: #0F172A;
      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: #F8FAFC;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Background Mesh */
    .ambient-bg {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(at 15% 20%, rgba(37, 99, 235, 0.10) 0px, transparent 50%),
        radial-gradient(at 85% 80%, rgba(16, 185, 129, 0.07) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(241, 245, 249, 0.8) 0px, transparent 70%);
      z-index: 0;
    }

    .login-card {
      position: relative;
      z-index: 10;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      animation: slideUp 0.3s ease forwards;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .brand-subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-label {
      display: block;
      margin-bottom: 6px;
      font-size: 12.5px;
      font-weight: 600;
      color: #334155;
    }

    .input-field {
      width: 100%;
      padding: 10px 14px;
      background: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-main);
      font-family: var(--font-main);
      font-size: 13.5px;
      outline: none;
      transition: all 0.15s ease;
    }

    .input-field:focus {
      background: #FFFFFF;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .btn-login {
      width: 100%;
      padding: 11px;
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      font-family: var(--font-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      margin-top: 8px;
      box-shadow: 0 1px 2px rgba(37, 99, 235, 0.2);
    }

    .btn-login:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(37, 99, 235, 0.25);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .error-box {
      color: #DC2626;
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 500;
      margin-top: 14px;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="ambient-bg"></div>

  <div class="login-card">
    <div class="brand-header">
      <div class="brand-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
      </div>
      <h1 class="brand-title">AutoRestock V2</h1>
      <p class="brand-subtitle">Autonomous Inventory & Procurement System</p>
    </div>
    
    <form id="loginForm">
      <div class="input-group">
        <label class="input-label" for="username">Username</label>
        <input type="text" id="username" class="input-field" required autocomplete="username" placeholder="Masukkan username...">
      </div>
      <div class="input-group">
        <label class="input-label" for="password">Password</label>
        <input type="password" id="password" class="input-field" required autocomplete="current-password" placeholder="Masukkan password...">
      </div>
      
      <button type="submit" class="btn-login" id="loginBtn">
        <span>Masuk ke Sistem</span>
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </button>

      <div class="error-box" id="errorMsg"></div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const error = document.getElementById('errorMsg');
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      btn.innerHTML = '<span>Memverifikasi...</span>';
      btn.disabled = true;
      error.style.display = 'none';
      error.textContent = '';
      
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          // Clear any legacy persistent tokens
          localStorage.removeItem('access_token');
          localStorage.removeItem('role');
          localStorage.removeItem('tenant_id');
          localStorage.removeItem('username');

          // Store in sessionStorage (cleared on browser/tab close)
          sessionStorage.setItem('access_token', data.access_token);
          sessionStorage.setItem('role', data.role);
          sessionStorage.setItem('tenant_id', data.tenant_id);
          sessionStorage.setItem('username', username);
          
          if (data.role === 'ADMIN') {
            window.location.href = '/static/admin.html';
          } else {
            window.location.href = '/';
          }
        } else {
          error.textContent = data.detail || 'Login gagal. Periksa username dan password.';
          error.style.display = 'block';
          btn.innerHTML = '<span>Masuk ke Sistem</span><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>';
          btn.disabled = false;
        }
      } catch (err) {
        error.textContent = 'Terjadi gangguan koneksi ke server.';
        error.style.display = 'block';
        btn.innerHTML = '<span>Masuk ke Sistem</span><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>';
        btn.disabled = false;
      }
    });
    
    // Auto redirect only if valid session token already exists in current browser session
    if (sessionStorage.getItem('access_token')) {
      if (sessionStorage.getItem('role') === 'ADMIN') {
        window.location.href = '/static/admin.html';
      } else {
        window.location.href = '/';
      }
    }
  </script>
</body>
</html>
