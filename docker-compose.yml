version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autorestock-agent-app
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=AutoRestock-Agent
      - APP_ENV=development
      - MOCK_MODELS=true
      - STORAGE_DIR=/app/storage
      - DATA_DIR=/app/data
    volumes:
      - .:/app
      - ./storage:/app/storage
    restart: unless-stopped
