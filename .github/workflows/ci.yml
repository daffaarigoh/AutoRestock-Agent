name: AutoRestock-Agent CI

on:
  push:
    branches: [ main, dev, 'codex/**', 'wave-2-stability-and-consistency' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Generate Bali Tower Database & Sample Data
      run: |
        python scripts/generate_balitower_data.py

    - name: Run Frontend Security Regression Test
      run: node tests/test_dashboard_rendering.cjs

    - name: Run Test Suites
      run: |
        pytest tests/